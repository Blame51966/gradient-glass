plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'io.github.gradientglass'
version = '1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.259'
}

tasks.named('processResources', ProcessResources) {
    from(zipTree('tools/glass-textures.zip'))
}

tasks.named('jar', Jar) {
    from('LICENSE')
}
